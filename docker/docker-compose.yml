version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: control-obra-web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ../src:/usr/share/nginx/html:ro
    networks:
      - control-obra-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-obra.rule=Host(`obra.srv1090924.hstgr.cloud`)"
      - "traefik.http.routers.control-obra.entrypoints=websecure"
      - "traefik.http.routers.control-obra.tls.certresolver=letsencrypt"
      - "traefik.http.services.control-obra.loadbalancer.server.port=80"

networks:
  control-obra-network:
    external: true
    name: traefik-network
