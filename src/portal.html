<!DOCTYPE html>
<html lang="es-MX">
<head>

<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#16202a;--muted:#55677a;--line:#d9e0e6;--primary:#1e3a5f;--accent:#0369a1;--ok:#047857;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--danger:#b91c1c;--danger-soft:#fee2e2}
/* Tokens que consume nav-shell.css (mismos nombres que styles.css de la app; el portal no carga styles.css). US-604 */
:root{--surface-2:#f1f5f9;--line-strong:#cbd5e1;--ink-muted:var(--muted);--ink-subtle:#64748b;--primary-ink:#fff;--accent-soft:#e0f2fe;--accent-fill:#0284c7;--ring:#0284c7;--backdrop:rgba(15,23,42,.5);
--sp-2:8px;--sp-3:12px;--sp-4:16px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-pill:999px;
--shadow-2:0 4px 12px rgba(15,23,42,.10);--shadow-3:0 10px 40px rgba(15,23,42,.16);
--z-dropdown:20;--z-sticky:30;--z-backdrop:50;--z-drawer:60;--fs-xs:11px;--fs-sm:13px;--fs-base:15px;--fs-lg:18px;--tap:44px;--sb-w:240px;--sb-w-col:64px;--dur-1:150ms;--dur-2:250ms}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0))}
/* US-618: de 900 px para arriba, barra del cliente a la izquierda y contenido a la derecha */
.shell{display:block}
#navCliente{display:none}
/* Cabecera móvil: chip de obra, botón de cuenta y su menú (US-619) */
.chip-obra,.btn-cuenta{flex:0 0 auto;min-height:var(--tap);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.chip-obra:hover,.btn-cuenta:hover{background:var(--surface-2)}
.chip-obra:focus-visible,.btn-cuenta:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.menu-portal{position:absolute;right:14px;z-index:var(--z-dropdown);min-width:220px;max-width:calc(100vw - 28px);display:flex;flex-direction:column;gap:2px;padding:6px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-3)}
.menu-item{display:block;width:100%;min-height:var(--tap);padding:10px 12px;border:0;border-radius:var(--radius-sm);background:none;color:var(--ink);font:inherit;font-size:15px;text-align:left;text-decoration:none;cursor:pointer}
.menu-item:hover{background:var(--surface-2)}
.menu-item.activo{background:var(--accent-soft);color:var(--accent);font-weight:600}
.menu-item.peligro{color:var(--danger)}
.menu-item:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.aviso-pago{border-color:var(--accent)}
.chip.nuevo{margin-left:6px;font-size:11px}
.mini{position:relative;display:inline-block}
.mini .nuevo{position:absolute;top:4px;left:4px;margin:0}
.pc-obras{padding:0 var(--sp-3) var(--sp-2)}
.pc-obras label{display:block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-subtle);margin-bottom:2px}
.pc-obras select{width:100%;padding:8px 10px;font-size:14px;font-family:inherit;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
#navClienteBottom{display:block}
@media(min-width:900px){
  .solo-movil{display:none!important}
  #navClienteBottom{display:none}
  .shell{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);align-items:start;gap:0;max-width:1100px;margin:0 auto}
  #navCliente{display:block;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 8px;border-right:1px solid var(--line);background:var(--surface)}
  .shell .wrap{margin:0;padding:16px 24px 56px}   /* en escritorio no hay barra inferior que esquivar */
  .shell footer{max-width:760px;margin:0 auto;padding-left:24px;padding-right:24px}
}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px}header img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--line)}
header .emp{font-weight:700;color:var(--primary);flex:1}header .emp small{display:block;font-weight:400;color:var(--muted);font-size:12px}
h1{font-size:22px;line-height:1.2;margin:4px 0 2px}.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}
.bar{height:10px;background:#e5eaf0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--danger-soft);color:var(--danger)}.c-info{background:#e1eaf6;color:#2f5b8f}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}@media(min-width:560px){.fotos{grid-template-columns:repeat(4,1fr)}}.fotos a{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#e5eaf0}.fotos img{width:100%;height:100%;object-fit:cover}
.act{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.act .bar{width:110px}
.btn{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;padding:10px 14px;border-radius:9px;font-size:14px;font-weight:600;border:0;cursor:pointer}.btn.s{background:#fff;color:var(--primary);border:1px solid var(--line)}.btn:disabled{opacity:.6;cursor:default}
.pago{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}.pago dt{color:var(--muted)}.pago dd{margin:0;font-weight:600;word-break:break-all}
.copy{font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0 4px}
footer{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
.vacio{color:var(--muted);font-size:14px}
.doc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.doc:last-child{border-bottom:0}
.doc .meta{font-size:12px;color:var(--muted)}
.grupo{border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;margin-bottom:10px;background:#fbfcfe;scroll-margin-top:12px}
.grupo:last-child{margin-bottom:0}
.grupo.destacado{border-color:var(--accent);box-shadow:0 0 0 3px rgba(3,105,161,.15)}
.grupo-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.grupo-cab strong{font-size:14px;display:block;line-height:1.35}
.grupo .meta{font-size:12px;color:var(--muted);margin-top:2px}
.grupo .doc:first-of-type{border-top:1px solid var(--line);margin-top:8px}
.grupo .fotos{margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
@media(min-width:560px){.grupo .fotos{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}}
.btn.xs{padding:6px 11px;font-size:12px;border-radius:8px}
.act .ver{margin-top:6px}
.login{max-width:380px;margin:6vh auto 0}
.login .marca{text-align:center;margin-bottom:16px}
.login .marca h1{font-size:20px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.login .marca .sub{margin:0;font-size:14px;text-wrap:balance}
.login .card{padding:20px 18px;margin-bottom:0}
.login .campos{display:grid;gap:14px}
.login .campo label{margin:0 0 6px}
.login .btn{display:block;width:100%;margin-top:18px;padding:12px 14px;font-size:15px}
.login .ayuda{margin:14px 0 0;font-size:13px;line-height:1.45;text-align:center;color:var(--muted);text-wrap:balance}
.login .pie{margin:12px 0 0;text-align:center}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:9px 11px;font-size:14px;margin:10px 0 0}
.secciones{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.sec-btn{flex:0 0 auto;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.sec-btn:hover{background:var(--surface-2);color:var(--ink)}
.sec-btn.activa{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:600}
.sec-btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.barra select{width:auto;flex:1;min-width:200px;padding:8px 10px;font-size:14px}
.txt{background:none;border:0;color:var(--accent);font-size:13px;cursor:pointer;padding:4px;font-family:inherit}
</style>

<body>
<div class="shell">
<nav id="navCliente" aria-label="Secciones de tu obra"></nav>
<div class="col">
<div class="wrap">
<div id="app"><p class="sub">Cargando…</p></div>
<footer id="pie">Control de Obra</footer>
</div>
</div>
</div>
<nav id="navClienteBottom" aria-label="Secciones de tu obra"></nav>
<script src="js/nav-shell.js?v=20260903a"></script>
<script>
const SB='https://cpjdlaiarmxojiyhhpxt.supabase.co', ANON='sb_publishable_4UKToEePHAO3b_IlI8HlcQ_z_hKUa2y';
const $=(s)=>document.querySelector(s);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n)=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
const fecha=(d)=>d?new Date(d.length===10?d+'T12:00:00':d).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'';
const token=new URLSearchParams(location.search).get('t')||'';
let sesion=localStorage.getItem('portal_sesion')||'', obras=[], obraActual=null, usuario=null;

async function rpc(fn,body){
  try{
    const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    const d=await r.json().catch(()=>null);
    if(!r.ok) return {error:(d&&(d.message||d.error))||'No se pudo conectar. Revisa tu internet.'};
    return d||{};
  }catch(e){ return {error:'No se pudo conectar. Revisa tu internet.'}; }
}
async function copiar(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent='Copiado';setTimeout(()=>btn.textContent='Copiar',1500);}catch(e){}}
function estadoChip(e){e=String(e||'');if(/cobrad|pagad|aprobad|completad|termin/i.test(e))return`<span class="chip c-ok">${esc(e)}</span>`;if(/parcial|proceso|pendiente/i.test(e))return`<span class="chip c-warn">${esc(e)}</span>`;if(/vencid|cancel|rechaz/i.test(e))return`<span class="chip c-bad">${esc(e)}</span>`;return`<span class="chip c-info">${esc(e||'-')}</span>`;}

/* ---------- Entrada: enlace privado o sesión con contraseña ---------- */
async function arranca(){
  if(token){
    if(!/^[a-f0-9]{48}$/.test(token))return pantallaError('Enlace no válido','Pide a tu constructor un enlace nuevo.');
    const d=await rpc('portal_obra',{p_token:token});
    if(!d||d.error)return pantallaError('Este enlace ya no está activo','Pide a tu constructor un enlace nuevo.');
    return pintarObra(d);
  }
  if(sesion){
    const s=await rpc('portal_sesion',{p_token:sesion});
    if(s&&s.ok){
      usuario=s.usuario;obras=s.obras||[];
      if(usuario.debe_cambiar)return pantallaPassword(true);
      return abrirObra(obras.length?obras[0].id:null);
    }
    localStorage.removeItem('portal_sesion');sesion='';
  }
  pantallaLogin();
}
function pantallaError(titulo,texto){$('#app').innerHTML=`<div class="card" style="margin-top:6vh"><h2>${esc(titulo)}</h2><p class="vacio">${esc(texto)}</p></div>`;}

function pantallaLogin(msg){
  $('#app').innerHTML=`<div class="login">
    <div class="marca"><h1>Avance de tu obra</h1><p class="sub">Entra con el usuario y la contraseña que te dio tu constructor.</p></div>
    <form class="card" id="formLogin">
      <div class="campos">
        <div class="campo"><label for="lgUsuario">Usuario</label>
          <input id="lgUsuario" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required></div>
        <div class="campo"><label for="lgPass">Contraseña</label>
          <input id="lgPass" type="password" autocomplete="current-password" required></div>
      </div>
      ${msg?`<div class="err">${esc(msg)}</div>`:''}
      <button class="btn" id="lgBtn" type="submit">Entrar</button>
    </form>
    <p class="ayuda">¿Olvidaste tu contraseña? Pídele a tu constructor que te la reinicie.</p></div>`;
  $('#formLogin').addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const b=$('#lgBtn');b.disabled=true;b.textContent='Entrando…';
    const d=await rpc('portal_login',{p_usuario:$('#lgUsuario').value.trim(),p_password:$('#lgPass').value,p_user_agent:navigator.userAgent});
    if(!d||!d.ok)return pantallaLogin((d&&d.error)||'Usuario o contraseña incorrectos.');
    sesion=d.token;localStorage.setItem('portal_sesion',sesion);usuario=d.usuario;obras=d.obras||[];
    if(usuario.debe_cambiar)return pantallaPassword(true);
    abrirObra(obras.length?obras[0].id:null);
  });
}

function pantallaPassword(obligatorio,msg){
  $('#app').innerHTML=`<div class="login">
    <div class="marca"><h1>${obligatorio?'Elige tu contraseña':'Cambiar contraseña'}</h1>
      ${obligatorio?'<p class="sub">Es tu primera vez aquí. Cambia la contraseña que te dieron por una tuya.</p>':''}</div>
    <form class="card" id="formPass">
      <div class="campos">
        <div class="campo"><label for="pwAct">Contraseña actual</label>
          <input id="pwAct" type="password" autocomplete="current-password" required></div>
        <div class="campo"><label for="pwNue">Contraseña nueva</label>
          <input id="pwNue" type="password" autocomplete="new-password" minlength="8" required>
          <p class="vacio" style="font-size:12px;margin:6px 0 0">Al menos 8 caracteres.</p></div>
      </div>
      ${msg?`<div class="err">${esc(msg)}</div>`:''}
      <button class="btn" id="pwBtn" type="submit">Guardar</button>
      ${obligatorio?'':'<p class="pie"><button type="button" class="txt" onclick="volver()">Cancelar</button></p>'}
    </form>
    <p class="pie"><button class="txt" onclick="salir()">Cerrar sesión</button></p></div>`;
  $('#formPass').addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const b=$('#pwBtn');b.disabled=true;b.textContent='Guardando…';
    const d=await rpc('portal_password',{p_token:sesion,p_actual:$('#pwAct').value,p_nueva:$('#pwNue').value});
    if(!d||!d.ok)return pantallaPassword(obligatorio,(d&&d.error)||'No se pudo cambiar la contraseña.');
    const s=await rpc('portal_sesion',{p_token:sesion});
    if(s&&s.ok){usuario=s.usuario;obras=s.obras||[];}
    abrirObra(obraActual||(obras.length?obras[0].id:null));
  });
}
function volver(){abrirObra(obraActual||(obras.length?obras[0].id:null));}
async function salir(){await rpc('portal_logout',{p_token:sesion});localStorage.removeItem('portal_sesion');sesion='';location.href=location.pathname;}

async function abrirObra(id){
  if(!id)return pantallaError('Todavía no tienes una obra asignada','Escríbele a tu constructor para que te dé acceso.');
  obraActual=Number(id);
  $('#app').innerHTML='<p class="sub">Cargando…</p>';
  const d=await rpc('portal_datos',{p_token:sesion,p_obra_id:obraActual});
  if(!d||d.error){
    if(d&&d.error==='sesion_invalida'){localStorage.removeItem('portal_sesion');sesion='';return pantallaLogin('Tu sesión expiró. Entra otra vez.');}
    return pantallaError('No pudimos abrir la obra','Inténtalo de nuevo en un momento.');
  }
  pintarObra(d);
}
function cambiarObra(sel){abrirObra(Number(sel.value));}

/* ---------- Entregables agrupados por hito ---------- */
function irA(id){
  // US-617: los entregables viven en su propia sección; primero se cambia de vista y luego se hace scroll
  if(seccion!=='entregables'){seccion='entregables';if(location.hash!=='#entregables')history.replaceState(null,'','#entregables');pintarSeccion();}
  setTimeout(()=>{
    const el=document.getElementById(id);if(!el)return;
    el.scrollIntoView({behavior:'smooth',block:'start'});
    el.classList.add('destacado');setTimeout(()=>el.classList.remove('destacado'),1800);
  },40);
}
function etiquetaVer(g){
  const d=g.docs.length,f=g.fotos.length;
  if(d&&f)return 'Ver la entrega';
  if(d)return d===1?'Ver el entregable':'Ver los entregables';
  return f===1?'Ver la foto':'Ver las fotos';
}
function miniatura(f){
  return `<a class="mini${esNuevo(f)?' es-nueva':''}" href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.titulo||f.descripcion||'')} ${fecha(f.fecha)}"><img src="${esc(f.thumb||f.url)}" alt="${esc(f.titulo||'Foto de obra')}" loading="lazy">${esNuevo(f)?'<span class="chip c-ok nuevo">Nuevo</span>':''}</a>`;
}
function filaDoc(x){
  return `<div class="doc"><div><div>${esc(x.nombre)} ${etiquetaNuevo(x)}</div><div class="meta">${esc(x.categoria||'')}${x.fecha?' · '+fecha(x.fecha):''}${(x.version&&Number(x.version)>1)?' · versión '+esc(x.version):''}${x.descripcion?' · '+esc(x.descripcion):''}</div></div><div>${(x.tiene_archivo||x.url)?`<button class="btn s xs" onclick="verDocumento(${x.id},this)">Abrir</button>`:'<span class="vacio">Sin archivo</span>'}</div></div>`;
}
function bloqueEntrega(id,titulo,fch,g,a){
  const hoy=new Date().toISOString().slice(0,10);
  const nd=g.docs.length,nf=g.fotos.length;
  const cuenta=[nd?nd+(nd===1?' documento':' documentos'):'',nf?nf+(nf===1?' foto':' fotos'):''].filter(Boolean).join(' · ');
  const estado=a?(Number(a.avance||0)>=100?'<span class="chip c-ok">Entregado</span>'
    :(a.fin&&String(a.fin)<hoy?'<span class="chip c-warn">En proceso</span>':'<span class="chip c-info">Programado</span>')):'';
  return `<section class="grupo" id="${id}">
    <div class="grupo-cab"><div><strong>${titulo}</strong>${(fch||cuenta)?`<div class="meta">${[fch,cuenta].filter(Boolean).join(' · ')}</div>`:''}</div>${estado}</div>
    ${g.docs.map(filaDoc).join('')}
    ${nf?`<div class="fotos">${g.fotos.map(miniatura).join('')}</div>`:''}
  </section>`;
}

// Telemetría del portal (portal_evento, migración 057): nunca debe romper la vista
async function portalEvento(evento, meta) {
  try { await rpc('portal_evento', { p_token: sesion || token, p_evento: evento, p_meta: meta || {} }); } catch (e) { }
}
function avisoPagoClic() { portalEvento('aviso_pago_clic', { obra_id: obraActual }); }

/* ---------- Vista de la obra: 6 secciones con ruta (US-617) ---------- */
// El payload de portal_datos se pide UNA vez por obra y se guarda aquí; cambiar de sección no vuelve a la red.
const SECCIONES = ['inicio', 'avance', 'pagos', 'entregables', 'fotos', 'contacto'];
const SEC_TITULO = { inicio: 'Inicio', avance: 'Avance', pagos: 'Pagos', entregables: 'Entregables', fotos: 'Fotos', contacto: 'Contacto' };
let datos = null;      // respuesta de portal_datos de la obra abierta
let ctx = null;        // todo lo derivado (totales, agrupaciones) calculado una sola vez
let seccion = 'inicio';

function seccionDeHash() {
  const h = String(location.hash || '').replace(/^#/, '').split('?')[0];
  return SECCIONES.includes(h) ? h : 'inicio';
}
function irASeccion(s, empujar) {
  const nueva = SECCIONES.includes(s) ? s : 'inicio';
  if (empujar !== false && seccionDeHash() !== nueva) { location.hash = '#' + nueva; return; }  // el hashchange repinta
  seccion = nueva;
  pintarSeccion();
}
// Aviso en línea dentro de la sección (sustituye los alert() del portal)
function aviso(msg) {
  const el = $('#vistaAviso');
  if (!el) return;
  el.innerHTML = msg ? `<div class="err">${esc(msg)}</div>` : '';
  if (msg) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Prepara todo lo que las vistas necesitan (se recalcula sólo al cambiar de obra)
function prepararCtx(d) {
  const o = d.obra, e = d.empresa;
  const plan = d.plan_pagos || [], pagos = d.pagos || [], acts = d.actividades || [];
  const fotos = d.fotos || [], ests = d.estimaciones || [], cfdis = d.cfdis || [], docs = d.documentos || [];
  const cobrado = pagos.reduce((a, p) => a + Number(p.monto || 0), 0);
  const contrato = Number(o.contrato || 0);
  const saldo = Math.max(0, contrato - cobrado);
  const hoy = new Date().toISOString().slice(0, 10);
  const proximo = plan.find(x => !/cobrad/i.test(x.estatus || '') && Number(x.monto) - Number(x.cobrado || 0) > 0.5);
  // Entregables agrupados por el hito del programa al que pertenecen; la llave 0 es lo que no tiene entrega asignada.
  const porHito = {};
  const cubo = k => (porHito[k] = porHito[k] || { docs: [], fotos: [] });
  docs.forEach(x => cubo(x.actividad_id || 0).docs.push(x));
  fotos.forEach(f => { if (f.actividad_id) cubo(f.actividad_id).fotos.push(f); });
  const gruposHito = acts.filter(a => porHito[a.id]);
  const dp = e.datos_pago || {};
  const wa = e.telefono ? ('https://wa.me/' + String(e.telefono).replace(/\D/g, '').replace(/^(\d{10})$/, '52$1') + '?text=' + encodeURIComponent('Hola, tengo una duda sobre la obra ' + o.nombre)) : '';
  return {
    o, e, plan, pagos, acts, fotos, ests, cfdis, docs, cobrado, contrato, saldo, hoy, proximo,
    porHito, gruposHito, sueltos: porHito[0], fotosSueltas: fotos.filter(f => !f.actividad_id),
    hayFotosEnGrupos: gruposHito.some(a => porHito[a.id].fotos.length), dp, wa,
    avance: Math.round(Number(o.avance || 0)),
  };
}

/* ---------- Las seis vistas ---------- */
function kpisHtml() {
  return `<div class="kpis">
    <div class="kpi"><b>${ctx.avance}%</b><span>Avance físico</span></div>
    <div class="kpi"><b>${fmt(ctx.contrato)}</b><span>Contrato</span></div>
    <div class="kpi"><b>${fmt(ctx.cobrado)}</b><span>Pagado a la fecha</span></div>
    <div class="kpi"><b>${fmt(ctx.saldo)}</b><span>Saldo por pagar</span></div>
  </div>`;
}
function tarjetaSiguientePago(resumida) {
  const p = ctx.proximo;
  if (!p) return '';
  const falta = Number(p.monto) - Number(p.cobrado || 0);
  const vencido = p.vence && p.vence < ctx.hoy;
  const cab = `<h2>Siguiente pago</h2><p style="margin:0 0 8px"><strong>${esc(p.concepto)}</strong> · ${fmt(falta)}${p.vence ? ' · vence ' + fecha(p.vence) : ''} ${vencido ? '<span class="chip c-bad">vencido</span>' : ''}</p>`;
  if (resumida) return `<div class="card" style="border-color:var(--accent)">${cab}<p style="margin:8px 0 0"><button class="btn s" onclick="irASeccion('pagos')">Ver pagos</button></p></div>`;
  const datosPago = (ctx.dp.clabe || ctx.dp.cuenta)
    ? `<dl class="pago"><dt>Banco</dt><dd>${esc(ctx.dp.banco || '')}</dd><dt>Titular</dt><dd>${esc(ctx.dp.titular || ctx.e.nombre)}</dd>${ctx.dp.clabe ? `<dt>CLABE</dt><dd>${esc(ctx.dp.clabe)} <button class="copy" onclick="copiar('${esc(ctx.dp.clabe)}',this)">Copiar</button></dd>` : ''}${ctx.dp.cuenta ? `<dt>Cuenta</dt><dd>${esc(ctx.dp.cuenta)} <button class="copy" onclick="copiar('${esc(ctx.dp.cuenta)}',this)">Copiar</button></dd>` : ''}${ctx.dp.referencia ? `<dt>Referencia</dt><dd>${esc(ctx.dp.referencia)}</dd>` : ''}</dl>${ctx.dp.instrucciones ? `<p style="font-size:13px;color:var(--muted);margin:8px 0 0">${esc(ctx.dp.instrucciones)}</p>` : ''}`
    : '<p class="vacio">Pide a tu constructor los datos de pago.</p>';
  const avisar = ctx.wa ? `<p style="margin:10px 0 0"><a class="btn s" href="${ctx.wa}" target="_blank" rel="noopener" onclick="avisoPagoClic()">Avisar que ya pagué por WhatsApp</a></p>` : '';
  return `<div class="card" style="border-color:var(--accent)">${cab}${datosPago}${avisar}</div>`;
}
function vistaInicio() {
  const a = ctx.acts;
  const hechas = a.filter(x => Number(x.avance || 0) >= 100).length;
  const sigHito = a.find(x => x.hito && Number(x.avance || 0) < 100);
  const linea = a.length
    ? `${hechas} de ${a.length} ${a.length === 1 ? 'actividad terminada' : 'actividades terminadas'}${sigHito ? ' · siguiente hito: ' + esc(sigHito.nombre) + (sigHito.fin ? ', ' + fecha(sigHito.fin) : '') : ''}`
    : 'Tu constructor aún no comparte el programa de trabajo.';
  const ultimas = ctx.fotos.slice(0, 3);
  const ultimoDoc = ctx.docs[0];
  const dias = Number(novedades().proximo_pago_dias);
  const avisoPago = (Number.isFinite(dias) && dias <= 7 && ctx.proximo)
    ? `<div class="card aviso-pago"><h2>${dias < 0 ? 'Tienes un pago vencido' : dias === 0 ? 'Tu siguiente pago vence hoy' : 'Siguiente pago: vence en ' + dias + (dias === 1 ? ' día' : ' días')}</h2><p style="margin:0 0 8px"><strong>${esc(ctx.proximo.concepto)}</strong> · ${fmt(Number(ctx.proximo.monto) - Number(ctx.proximo.cobrado || 0))}</p><button class="btn s" onclick="irASeccion('pagos')">Ver pagos</button></div>`
    : '';
  return kpisHtml() + avisoPago
    + `<div class="card"><h2>Cómo va tu obra <span class="chip c-info">${esc(ctx.o.estatus || '')}</span></h2>
      <div class="bar" aria-label="Avance ${ctx.avance}%"><i style="width:${Math.min(100, ctx.avance)}%"></i></div>
      <p style="margin:10px 0 0;font-size:14px">${linea}</p>
      <p style="margin:8px 0 0"><button class="btn s" onclick="irASeccion('avance')">Ver el programa</button></p></div>`
    + tarjetaSiguientePago(true)
    + (ultimas.length ? `<div class="card"><h2>Últimas fotos</h2><div class="fotos">${ultimas.map(miniatura).join('')}</div><p style="margin:10px 0 0"><button class="btn s" onclick="irASeccion('fotos')">Ver todas</button></p></div>` : '')
    + (ultimoDoc ? `<div class="card"><h2>Último entregable</h2>${filaDoc(ultimoDoc)}<p style="margin:10px 0 0"><button class="btn s" onclick="irASeccion('entregables')">Ver entregables</button></p></div>` : '');
}
function vistaAvance() {
  return `<div class="card"><h2>Programa de obra <span class="chip c-info">${esc(ctx.o.estatus || '')}</span></h2>
    <div class="bar" aria-label="Avance ${ctx.avance}%"><i style="width:${Math.min(100, ctx.avance)}%"></i></div>
    ${ctx.acts.length ? `<div style="margin-top:10px">${ctx.acts.map(a => `<div class="act"><div><div>${a.hito ? '🏁 ' : ''}${esc(a.nombre)}</div><div style="font-size:12px;color:var(--muted)">${fecha(a.inicio)}${a.fin ? ' a ' + fecha(a.fin) : ''}${a.responsable ? ' · ' + esc(a.responsable) : ''}</div>${ctx.porHito[a.id] ? `<button class="btn s xs ver" onclick="irA('ent-${a.id}')">${etiquetaVer(ctx.porHito[a.id])}</button>` : ''}</div><div><div class="bar"><i style="width:${Math.min(100, Number(a.avance || 0))}%"></i></div><div style="font-size:12px;text-align:right;color:var(--muted)">${Math.round(Number(a.avance || 0))}%</div></div></div>`).join('')}</div>` : '<p class="vacio">Tu constructor aún no comparte el programa de trabajo.</p>'}
  </div>`
    + (ctx.ests.length ? `<div class="card"><h2>Estimaciones</h2><div class="tbl"><table><thead><tr><th>Nº</th><th>Periodo</th><th class="n">Avance</th><th class="n">Total</th><th>Estado</th></tr></thead><tbody>${ctx.ests.map(x => `<tr><td>${esc(x.numero)}</td><td>${fecha(x.periodo_inicio)}${x.periodo_fin ? ' a ' + fecha(x.periodo_fin) : ''}</td><td class="n">${x.avance != null ? Math.round(Number(x.avance)) + '%' : ''}</td><td class="n">${fmt(x.total)}</td><td>${estadoChip(x.estatus)}</td></tr>`).join('')}</tbody></table></div></div>` : '');
}
function vistaPagos() {
  return tarjetaSiguientePago(false)
    + `<div class="card"><h2>Plan de pagos</h2>${ctx.plan.length ? `<div class="tbl"><table><thead><tr><th>Concepto</th><th class="n">Monto</th><th class="n">Pagado</th><th>Vence</th><th>Estado</th></tr></thead><tbody>${ctx.plan.map(x => `<tr><td>${esc(x.concepto)}</td><td class="n">${fmt(x.monto)}</td><td class="n">${fmt(x.cobrado)}</td><td>${fecha(x.vence)}</td><td>${estadoChip(x.estatus)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Sin plan de pagos registrado.</p>'}</div>`
    + `<div class="card"><h2>Pagos realizados</h2>${ctx.pagos.length ? `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Forma</th><th class="n">Monto</th></tr></thead><tbody>${ctx.pagos.map(p => `<tr><td>${fecha(p.fecha)}</td><td>${esc(p.concepto || p.numero || '')}</td><td>${esc(p.metodo || '')}</td><td class="n">${fmt(p.monto)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Aún no hay pagos registrados.</p>'}</div>`
    + (ctx.cfdis.length ? `<div class="card"><h2>Facturas</h2><div class="tbl"><table><thead><tr><th>Folio</th><th>Fecha</th><th class="n">Total</th><th></th></tr></thead><tbody>${ctx.cfdis.map(c => `<tr><td>${esc((c.serie || '') + (c.folio || ''))}<div style="font-size:11px;color:var(--muted)">${esc(c.uuid || '')}</div></td><td>${fecha(c.fecha)}</td><td class="n">${fmt(c.total)}</td><td>${c.tiene_archivo ? `<button class="copy" onclick="archivo(${c.id},'pdf')">PDF</button> <button class="copy" onclick="archivo(${c.id},'xml')">XML</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>` : '');
}
function vistaEntregables() {
  return `<div class="card"><h2>Entregables de tu obra</h2>${(ctx.gruposHito.length || ctx.sueltos)
    ? `${ctx.gruposHito.map(a => bloqueEntrega('ent-' + a.id, (a.hito ? '🏁 ' : '') + esc(a.nombre), fecha(a.inicio), ctx.porHito[a.id], a)).join('')}${ctx.sueltos ? bloqueEntrega('ent-otros', 'Otros documentos', '', ctx.sueltos, null) : ''}`
    : '<p class="vacio">Todavía no hay entregables publicados para ti.</p>'}</div>`;
}
function vistaFotos() {
  if (!ctx.fotos.length) return `<div class="card"><h2>Fotos de la obra</h2><p class="vacio">Todavía no hay fotos publicadas.</p></div>`;
  // La galería completa: primero las de cada entrega (con su etiqueta) y al final las sueltas
  const porEntrega = ctx.gruposHito.filter(a => ctx.porHito[a.id].fotos.length)
    .map(a => `<div class="card"><h2>${a.hito ? '🏁 ' : ''}${esc(a.nombre)}</h2><div class="fotos">${ctx.porHito[a.id].fotos.map(miniatura).join('')}</div></div>`).join('');
  const sueltas = ctx.fotosSueltas.length ? `<div class="card"><h2>${ctx.hayFotosEnGrupos ? 'Más fotos de la obra' : 'Fotos de la obra'}</h2><div class="fotos">${ctx.fotosSueltas.map(miniatura).join('')}</div></div>` : '';
  return porEntrega + sueltas;
}
function vistaContacto() {
  const e = ctx.e;
  return `<div class="card"><h2>¿Tienes una duda?</h2>
    <p style="margin:0 0 8px;font-size:14px">${esc(e.nombre)}${e.telefono ? ' · ' + esc(e.telefono) : ''}${e.email ? ' · ' + esc(e.email) : ''}</p>
    ${ctx.wa ? `<a class="btn" href="${ctx.wa}" target="_blank" rel="noopener">Escribir por WhatsApp</a>` : ''}
    ${sesion ? `<p style="margin:12px 0 0"><button class="txt" onclick="pantallaPassword(false)">Cambiar mi contraseña</button>${(usuario && usuario.usuario) ? `<span class="vacio" style="font-size:12px"> · entraste como ${esc(usuario.usuario)}</span>` : ''}</p>
    <p style="margin:8px 0 0"><button class="txt" onclick="salir()">Cerrar sesión</button></p>` : '<p class="vacio" style="margin:12px 0 0">Este enlace es privado; compártelo sólo con quien deba ver el avance de la obra.</p>'}</div>`;
}

/* ---------- Menús de la cabecera móvil (US-619) ---------- */
function cerrarMenuPortal() {
  const m = $('#menuPortal');
  if (m) { m.hidden = true; m.innerHTML = ''; }
  ['btnCuenta', 'chipObra'].forEach(id => { const b = document.getElementById(id); if (b) b.setAttribute('aria-expanded', 'false'); });
}
function abrirMenuPortal(html, disparador, rol) {
  const m = $('#menuPortal');
  if (!m) return;
  const abierto = !m.hidden && m.dataset.de === disparador;
  cerrarMenuPortal();
  if (abierto) return;                       // segundo toque: cerrar
  m.dataset.de = disparador;
  m.setAttribute('role', rol || 'menu');
  m.innerHTML = html;
  m.hidden = false;
  const b = document.getElementById(disparador);
  if (b) b.setAttribute('aria-expanded', 'true');
  const primero = m.querySelector('button,select,a');
  if (primero) primero.focus();
}
function menuCuenta() {
  const items = [];
  if (ctx.wa) items.push(`<a class="menu-item" href="${ctx.wa}" target="_blank" rel="noopener" onclick="cerrarMenuPortal()">Escribir por WhatsApp</a>`);
  items.push(`<button type="button" class="menu-item" onclick="cerrarMenuPortal();irASeccion('contacto')">Contacto</button>`);
  if (sesion) {
    items.push(`<button type="button" class="menu-item" onclick="cerrarMenuPortal();pantallaPassword(false)">Cambiar contraseña</button>`);
    items.push(`<button type="button" class="menu-item peligro" onclick="cerrarMenuPortal();salir()">Salir</button>`);
  }
  abrirMenuPortal(items.join(''), 'btnCuenta', 'menu');
}
function menuObras() {
  const items = obras.map(x => `<button type="button" class="menu-item${x.id === obraActual ? ' activo' : ''}" ${x.id === obraActual ? 'aria-current="true"' : ''} onclick="cerrarMenuPortal();abrirObra(${x.id})">${esc(x.nombre)}</button>`).join('');
  abrirMenuPortal(items, 'chipObra', 'listbox');
}
document.addEventListener('click', (ev) => {
  const m = $('#menuPortal');
  if (!m || m.hidden) return;
  if (m.contains(ev.target)) return;
  if (ev.target.closest && ev.target.closest('#btnCuenta,#chipObra')) return;
  cerrarMenuPortal();
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cerrarMenuPortal(); });

/* ---------- Marco y despacho ---------- */
function pintarObra(d) {
  datos = d;
  ctx = prepararCtx(d);
  seccion = seccionDeHash();
  $('#pie').innerHTML = (sesion ? 'Tu acceso es personal; no compartas tu contraseña.' : 'Este enlace es privado; compártelo sólo con quien deba ver el avance de la obra.') + '<br>Control de Obra' + (ctx.e.nombre ? ' · ' + esc(ctx.e.nombre) : '');
  const e = ctx.e, o = ctx.o;
  $('#app').innerHTML = `
  <header class="solo-movil">
    ${e.logo_url ? `<img src="${esc(e.logo_url)}" alt="" onerror="this.remove()">` : ''}
    <div class="emp">${esc(e.nombre)}<small>${(sesion && usuario) ? esc(usuario.nombre) : 'Avance de tu obra'}</small></div>
    ${(sesion && obras.length > 1) ? `<button type="button" class="chip-obra" id="chipObra" aria-haspopup="listbox" aria-expanded="false" onclick="menuObras()">Obra <span aria-hidden="true">▾</span></button>` : ''}
    <button type="button" class="btn-cuenta" id="btnCuenta" aria-haspopup="menu" aria-expanded="false" aria-label="Tu cuenta" onclick="menuCuenta()">${esc(((sesion && usuario) ? usuario.nombre : 'Menú').split(' ')[0])} <span aria-hidden="true">▾</span></button>
  </header>
  <div id="menuPortal" class="menu-portal" hidden></div>
  <h1>${esc(o.nombre)}</h1>
  <p class="sub">${esc(o.cliente || '')}${o.ubicacion ? ' · ' + esc(o.ubicacion) : ''}${o.fecha_inicio ? ' · inicio ' + fecha(o.fecha_inicio) : ''}${o.fecha_fin ? ' · entrega estimada ' + fecha(o.fecha_fin) : ''}</p>
  <nav class="secciones" id="navSecciones" aria-label="Secciones"></nav>
  <div id="vistaAviso"></div>
  <div id="vista"></div>`;
  pintarSeccion();
}
function pintarSeccion() {
  const cont = $('#vista');
  if (!cont || !ctx) return;
  if (seccion === 'fotos' || seccion === 'entregables') novedadesVistas.add(seccion);
  const fn = { inicio: vistaInicio, avance: vistaAvance, pagos: vistaPagos, entregables: vistaEntregables, fotos: vistaFotos, contacto: vistaContacto }[seccion] || vistaInicio;
  cont.innerHTML = fn();
  aviso('');
  cerrarMenuPortal();
  document.title = `${SEC_TITULO[seccion]} · ${ctx.o.nombre}`;
  pintarNavSecciones();
  window.scrollTo({ top: 0, behavior: 'auto' });
  portalEvento('seccion', { seccion: seccion, obra_id: obraActual });
}
// Barra del cliente con NavShell (US-618 escritorio, US-619 móvil). El menú de píldoras queda como respaldo
// si el componente no cargó (el portal no debe quedarse sin navegación por un archivo que falte).
const SEC_ICONO = { inicio: 'inicio', avance: 'avance', pagos: 'pagos', entregables: 'entregables', fotos: 'fotos', contacto: 'contacto' };
// Secciones cuyo aviso ya se vio en esta sesión (el servidor ya movió ultimo_visto_at al pedir los datos)
const novedadesVistas = new Set();
function novedades() { return (datos && datos.novedades) || {}; }
// Con enlace de token el servidor manda las novedades en cero (no hay visita anterior que comparar), pero el pago
// vencido no depende de la visita: sale del plan de pagos, así que se cuenta aquí (US-622).
function pagosVencidos() {
  const n = Number(novedades().pagos_vencidos);
  if (n > 0) return n;
  if (!ctx) return 0;
  return ctx.plan.filter(x => x.vence && x.vence < ctx.hoy && Number(x.monto) - Number(x.cobrado || 0) > 0.5).length;
}
function avisoDeSeccion(s) {
  const n = novedades();
  if (novedadesVistas.has(s)) return {};
  if (s === 'pagos') {
    const v = pagosVencidos();
    if (v > 0) return { badge: true, badgeAria: v + (v === 1 ? ' pago vencido' : ' pagos vencidos') };
    return {};
  }
  if (s === 'entregables' && Number(n.documentos) > 0) return { badge: Number(n.documentos), badgeAria: n.documentos + ' nuevos' };
  if (s === 'fotos' && Number(n.fotos) > 0) return { badge: Number(n.fotos), badgeAria: n.fotos + ' nuevas' };
  return {};
}
// ¿Este elemento llegó después de la última visita? (created_at del payload contra ultimo_visto_at)
function esNuevo(x) {
  const visto = novedades().ultimo_visto_at;
  const cuando = x && (x.creada || x.creado || x.created_at);
  if (!visto || !cuando) return false;
  return String(cuando) > String(visto);
}
function etiquetaNuevo(x) { return esNuevo(x) ? '<span class="chip c-ok nuevo">Nuevo</span>' : ''; }
function navModeloCliente() {
  const e = ctx.e;
  const grupos = [{ k: 'secciones', t: 'Tu obra', suelto: false, plano: true, items: SECCIONES.map(s => Object.assign({ k: s, t: SEC_TITULO[s], ic: SEC_ICONO[s] }, avisoDeSeccion(s))) }];
  const acciones = [];
  if (sesion) {
    acciones.push({ k: 'password', t: 'Cambiar contraseña', ic: 'cuenta', onClick: 'pantallaPassword(false)' });
    acciones.push({ k: 'salir', t: 'Salir', ic: 'mas', onClick: 'salir()', tono: 'danger' });
  }
  return {
    modo: 'cliente', prefijo: 'pc',
    marca: { nombre: e.nombre || 'Tu obra', sub: (sesion && usuario) ? usuario.nombre : 'Avance de tu obra', logo: e.logo_url || '' },
    grupos, activo: seccion, acciones,
    onItem: "irASeccion('{k}')",
    inferior: { items: ['inicio', 'avance', 'pagos', 'entregables', 'fotos'] },
  };
}
function pintarNavSecciones() {
  const pill = $('#navSecciones');
  const aside = $('#navCliente'), bottom = $('#navClienteBottom');
  if (typeof NavShell === 'undefined' || !ctx) {
    if (pill) pill.innerHTML = SECCIONES.map(s => `<button type="button" class="sec-btn${s === seccion ? ' activa' : ''}"${s === seccion ? ' aria-current="page"' : ''} onclick="irASeccion('${s}')">${SEC_TITULO[s]}</button>`).join('');
    return;
  }
  const m = navModeloCliente();
  const r = NavShell.render(m);
  if (aside) aside.innerHTML = r.aside;
  if (bottom) bottom.innerHTML = r.bottom;
  // Con la barra pintada, las píldoras sobran (se quedan sólo si NavShell no cargó)
  if (pill) pill.innerHTML = '';
  // Selector de obra: sólo con sesión de cuenta y más de una obra
  if (aside && sesion && obras.length > 1) {
    const sel = `<div class="pc-obras"><label for="selObraNav">Obra</label><select id="selObraNav" onchange="cambiarObra(this)">${obras.map(x => `<option value="${x.id}" ${x.id === obraActual ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select></div>`;
    const marca = aside.querySelector('.nvs-marca');
    if (marca) marca.insertAdjacentHTML('afterend', sel);
  }
}
window.addEventListener('hashchange', () => {
  if (!ctx) return;                  // todavía no hay obra abierta: lo resuelve abrirObra
  const s = seccionDeHash();
  if (s === seccion) return;
  seccion = s;
  pintarSeccion();
});

async function pedirArchivo(cuerpo){
  try{
    const r=await fetch(SB+'/functions/v1/portal-archivo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cuerpo)});
    return await r.json().catch(()=>null);
  }catch(e){ return null; }
}
async function archivo(id,tipo){
  const j=await pedirArchivo({token,sesion,cfdi_id:id,tipo});
  if(!j||!j.url){aviso((j&&j.error)||'No se pudo abrir el archivo. Inténtalo de nuevo o escríbele a tu constructor.');return;}
  window.open(j.url,'_blank','noopener');
}
async function verDocumento(id,btn){
  if(btn){btn.disabled=true;btn.textContent='Abriendo…';}
  const j=await pedirArchivo({token,sesion,documento_id:id});
  if(btn){btn.disabled=false;btn.textContent='Abrir';}
  if(!j||!j.url){aviso((j&&j.error)||'No se pudo abrir el documento. Inténtalo de nuevo o escríbele a tu constructor.');return;}
  window.open(j.url,'_blank','noopener');
}
arranca();
